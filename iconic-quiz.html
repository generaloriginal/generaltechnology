<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#26256f">
  <title>Quiz: Imagens e Comerciais Icônicos</title>
  <style>
    :root {
      --ink: #171936;
      --indigo: #33308d;
      --violet: #5b52e8;
      --paper: #fbfaf7;
      --mist: #edf0f8;
      --line: #d7dbea;
      --success: #147447;
      --success-pale: #ddf5e7;
      --danger: #b42332;
      --danger-pale: #fff0f1;
      --shadow: 0 18px 50px rgba(24, 24, 67, .16);
    }

    * { box-sizing: border-box; }
    html { background: var(--indigo); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 15% 5%, #857eff 0, transparent 28rem), var(--indigo);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; }
    button:focus-visible { outline: 4px solid #f8c84c; outline-offset: 4px; }

    .app-shell {
      width: min(100%, 1080px);
      min-height: 100vh;
      margin: auto;
      padding: max(20px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 22px;
    }
    .topbar { color: white; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .eyebrow { margin: 0 0 4px; font-size: .82rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.08; }
    .progress-wrap { min-width: min(35vw, 220px); text-align: right; }
    .progress-label { display: block; margin-bottom: 7px; font-size: .86rem; font-weight: 700; }
    .progress-track { height: 10px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.28); }
    .progress-fill { height: 100%; width: 16.67%; border-radius: inherit; background: #f8c84c; transition: width .35s ease; }

    .quiz-card { align-self: center; overflow: hidden; border-radius: 28px; background: var(--paper); box-shadow: var(--shadow); }
    .quiz-content { padding: clamp(24px, 5vw, 52px); }
    .question-number { margin: 0 0 10px; color: var(--violet); font-size: 1rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    h2 { max-width: 920px; margin: 0; font-size: clamp(1.55rem, 4.2vw, 2.7rem); line-height: 1.13; }
    .prompt { max-width: 920px; margin: 18px 0 0; font-size: clamp(1.1rem, 2.5vw, 1.42rem); font-weight: 650; line-height: 1.42; }
    .media-frame {
      min-height: clamp(180px, 32vw, 310px);
      margin: 26px 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px dashed #bfc7dc;
      border-radius: 18px;
      background: linear-gradient(135deg, #e8ebf5, #f5f6fb);
    }
    .media-frame img, .media-frame video { width: 100%; height: 100%; max-height: 310px; object-fit: contain; background: #101020; }
    .media-frame iframe { width: min(100%, 550px); aspect-ratio: 16 / 9; border: 0; background: #101020; }
    .media-placeholder { max-width: 32rem; padding: 24px; color: #51607c; text-align: center; }
    .media-placeholder strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 1.08rem; }
    .media-placeholder p { margin: 0; line-height: 1.45; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .answer {
      min-height: 76px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: white;
      font-size: clamp(1rem, 2.25vw, 1.25rem);
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .answer:not(:disabled):hover { transform: translateY(-2px); border-color: var(--violet); }
    .answer:disabled { cursor: default; }
    .answer-letter { flex: 0 0 auto; width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; color: var(--violet); background: #eeeefe; font-size: .92rem; }
    .answer.wrong { border-color: var(--danger); color: #7f1826; background: var(--danger-pale); }
    .answer.wrong .answer-letter { color: white; background: var(--danger); }
    .answer.correct { border-color: var(--success); color: #075f35; background: var(--success-pale); }
    .answer.correct .answer-letter { color: white; background: var(--success); }
    .feedback { min-height: 66px; margin-top: 20px; padding: 15px 18px; display: flex; align-items: center; gap: 12px; border-radius: 14px; color: #43526d; background: var(--mist); font-size: 1rem; font-weight: 650; line-height: 1.35; }
    .feedback[data-state="wrong"] { color: #841a29; background: var(--danger-pale); }
    .feedback[data-state="correct"] { color: #075f35; background: var(--success-pale); }
    .feedback-icon { font-size: 1.35rem; }
    .actions { min-height: 78px; padding: 16px clamp(24px, 5vw, 52px); display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); background: #f5f6fb; }
    .attempts { color: #59647b; font-size: .95rem; font-weight: 650; }
    .next-button, .restart-button {
      min-height: 52px;
      padding: 13px 24px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: var(--indigo);
      box-shadow: 0 4px 0 #1d1a5a;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .next-button:active, .restart-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d1a5a; }
    .next-button[hidden] { display: none; }
    .summary { padding: clamp(32px, 8vw, 76px); text-align: center; }
    .summary h2 { margin: 8px auto 16px; }
    .summary p { max-width: 42rem; margin: 0 auto 28px; color: #56627b; font-size: 1.12rem; line-height: 1.5; }
    .score { width: min(100%, 360px); margin: 28px auto; padding: 24px; border-radius: 20px; color: #172d25; background: var(--success-pale); }
    .score strong { display: block; color: var(--success); font-size: clamp(2.5rem, 8vw, 4.2rem); line-height: 1; }
    .score span { display: block; margin-top: 8px; font-weight: 750; }
    .failure-score { color: #751923; background: var(--danger-pale); }
    .failure-score strong { color: var(--danger); }
    .shake { animation: shake .36s ease-in-out; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    .feedback-effect { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; pointer-events: none; overflow: hidden; }
    .feedback-effect::before { content: ""; position: absolute; inset: 0; opacity: 0; }
    .feedback-effect__badge { z-index: 1; width: clamp(110px, 18vw, 175px); aspect-ratio: 1; display: grid; place-items: center; border: 7px solid currentColor; border-radius: 50%; color: white; font-size: clamp(4rem, 9vw, 7rem); font-weight: 900; line-height: 1; transform: scale(.2); }
    .feedback-effect--wrong { color: #df2a3f; }
    .feedback-effect--wrong::before { background: rgba(204, 35, 54, .34); animation: red-flash .55s ease-out; }
    .feedback-effect--wrong .feedback-effect__badge { background: #df2a3f; animation: wrong-badge .62s cubic-bezier(.2,.8,.2,1) both; }
    .feedback-effect--correct { color: #14824d; }
    .feedback-effect--correct::before { background: rgba(20, 130, 77, .25); animation: green-flash .72s ease-out; }
    .feedback-effect--correct .feedback-effect__badge { background: #14824d; box-shadow: 0 0 0 12px rgba(255,255,255,.46), 0 0 56px rgba(20,130,77,.66); animation: correct-badge .86s cubic-bezier(.2,.9,.2,1) both; }
    .confetti { position: absolute; top: 50%; left: 50%; width: 12px; height: 20px; border-radius: 3px; background: var(--confetti); transform: translate(-50%, -50%) rotate(var(--rotate)); animation: confetti .95s cubic-bezier(.15,.8,.25,1) forwards; }
    .level-up { position: fixed; z-index: 21; inset: 0; display: grid; place-items: center; padding: 24px; color: white; text-align: center; background: rgba(27, 24, 104, .82); backdrop-filter: blur(7px); animation: level-backdrop 1.25s ease both; }
    .level-up__panel { width: min(100%, 480px); padding: clamp(30px, 6vw, 54px) 28px; border: 3px solid rgba(255,255,255,.78); border-radius: 28px; background: linear-gradient(135deg, #6a5cff, #322d9a); box-shadow: 0 24px 65px rgba(0,0,0,.36); animation: level-panel 1.05s cubic-bezier(.18,.9,.2,1) both; }
    .level-up__stars { margin-bottom: 10px; color: #f8c84c; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: .22em; text-shadow: 0 0 18px rgba(248,200,76,.85); }
    .level-up__eyebrow { margin: 0 0 5px; font-size: .9rem; font-weight: 900; letter-spacing: .16em; }
    .level-up strong { display: block; font-size: clamp(2rem, 8vw, 4rem); line-height: 1; }
    .level-up p:last-child { margin: 14px 0 0; font-size: 1.1rem; font-weight: 700; opacity: .9; }
    .finale { position: fixed; z-index: 22; inset: 0; display: grid; place-items: center; overflow: hidden; color: white; text-align: center; background: radial-gradient(circle at center, rgba(123, 105, 255, .95), rgba(31, 27, 111, .97)); }
    .finale__content { z-index: 1; padding: 24px; animation: finale-content 1.3s cubic-bezier(.18,.9,.2,1) both; }
    .finale__trophy { display: block; margin-bottom: 8px; font-size: clamp(5rem, 15vw, 9rem); filter: drop-shadow(0 12px 16px rgba(0,0,0,.25)); }
    .finale strong { display: block; font-size: clamp(2.3rem, 8vw, 4.8rem); line-height: 1; }
    .finale p { margin: 14px 0 0; font-size: clamp(1.1rem, 3vw, 1.45rem); font-weight: 800; }
    .summary-celebration { margin-bottom: 8px; color: #f3b919; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: .12em; animation: star-dance 1s ease-in-out infinite alternate; text-shadow: 0 5px 10px rgba(172,120,0,.22); }
    @keyframes red-flash { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes green-flash { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes wrong-badge { 0% { opacity: 0; transform: scale(.2) rotate(-15deg); } 35% { opacity: 1; transform: scale(1.12) rotate(8deg); } 68% { transform: scale(.92) rotate(-4deg); } 100% { opacity: 0; transform: scale(1.1) rotate(0); } }
    @keyframes correct-badge { 0% { opacity: 0; transform: scale(.25); } 40% { opacity: 1; transform: scale(1.14); } 68% { opacity: 1; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.08); } }
    @keyframes confetti { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(calc(var(--rotate) + 520deg)); } }
    @keyframes level-backdrop { 0% { opacity: 0; } 12%, 82% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes level-panel { 0% { opacity: 0; transform: translateY(42px) scale(.75); } 28%, 78% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-24px) scale(1.04); } }
    @keyframes finale-content { 0% { opacity: 0; transform: scale(.5) translateY(32px); } 32%, 76% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(1.12) translateY(-24px); } }
    @keyframes star-dance { from { transform: rotate(-3deg) scale(.96); } to { transform: rotate(3deg) scale(1.06); } }
    @media (max-width: 620px) {
      .app-shell { padding-left: 14px; padding-right: 14px; }
      .topbar { align-items: flex-start; }
      .progress-wrap { min-width: 112px; }
      .quiz-card { border-radius: 20px; }
      .answers { grid-template-columns: 1fr; }
      .actions { align-items: flex-start; flex-direction: column; }
      .next-button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">Desafio em grupo</p><h1>Imagens e Comerciais Icônicos</h1></div>
      <div class="progress-wrap" aria-label="Progresso"><span class="progress-label" id="progressLabel">Pergunta 1 de 6</span><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
    </header>
    <section class="quiz-card" aria-labelledby="questionTitle" id="quizCard">
      <div class="quiz-content" id="quizContent"></div>
      <footer class="actions" id="actions"><span class="attempts" id="attempts">Tentativas nesta pergunta: 0</span><button class="next-button" id="nextButton" type="button" hidden>Próxima pergunta <span aria-hidden="true">→</span></button></footer>
    </section>
  </main>
  <div id="effects" aria-hidden="true"></div>

  <script>
    // Add the supplied photos/videos here later. Use a local path such as
    // "iconic-quiz-media/vj-day.jpg" or "iconic-quiz-media/apple-1984.mp4".
    const questions = [
      { title: "O Beijo da Vitória", prompt: "Em que ano esta foto foi tirada?", media: "iconic-quiz-media/vj-day-times-square.jpeg", mediaLabel: "Foto do Beijo na Times Square", answers: ["1939 (Início da Guerra)", "1945 (Fim da Segunda Guerra)", "1950 (Guerra da Coreia)", "1942 (Batalha de Midway)"], correct: 1 },
      { title: "A Selfie Histórica", prompt: "Em qual evento aconteceu esta selfie?", media: "iconic-quiz-media/oscar-selfie-2014.jpg", mediaLabel: "Selfie do Oscar de 2014", answers: ["Festival de Cinema de Cannes", "Baile do Met Gala", "Cerimônia de Entrega do Oscar", "Grammy Awards"], correct: 2 },
      { title: "A Era da IA Generativa", prompt: "Qual é o título desta obra?", media: "iconic-quiz-media/theatre-opera-spatial.jpg", mediaLabel: "Obra premiada de IA", answers: ["Théâtre D'Opéra Spatial", "The Digital Renaissance", "Artificial Dreamscape", "Cybernetic Canvas"], correct: 0 },
      { title: "Comerciais de Natal", prompt: "Qual é esta campanha publicitária?", media: "iconic-quiz-media/coca-cola-polar-bears-5s-clip.mp4", mediaLabel: "Comercial de Natal Coca-Cola com ursos polares", answers: ["Ursos Polares da Coca-Cola", "Comercial de Natal da Pepsi", "Campanha dos pinguins da Antarctica", "Comercial de fim de ano da Fanta"], correct: 0 },
      { title: "O Slogan Publicitário", prompt: "Qual produto este comercial lançou?", media: "iconic-quiz-media/apple-1984-macintosh-clip.mp4", mediaLabel: 'Comercial Apple "1984"', answers: ["O primeiro iPhone", "O computador Macintosh", "O tocador de música iPod", "O tablet iPad"], correct: 1 },
      { title: "Fotografia Documental", prompt: "Qual período histórico esta foto retrata?", media: "iconic-quiz-media/migrant-mother-1936.jpg", mediaLabel: 'Foto "Migrant Mother"', answers: ["A Corrida do Ouro", "A Grande Depressão (Crise de 1929)", "O Pós-Segunda Guerra Mundial", "A Guerra do Vietnã"], correct: 1 }
    ];

    const content = document.getElementById("quizContent");
    const progressLabel = document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");
    const attemptsLabel = document.getElementById("attempts");
    const nextButton = document.getElementById("nextButton");
    const quizCard = document.getElementById("quizCard");
    const effects = document.getElementById("effects");
    let questionIndex = 0, attempts = 0, totalAttempts = 0, isCorrect = false;

    function playTone(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const context = new AudioContext();
        context.resume();
        const notes = type === "correct" ? [[523, 0], [659, .11], [784, .22]] : type === "level" ? [[392, 0], [523, .1], [659, .2], [784, .3]] : type === "finale" ? [[523, 0], [659, .1], [784, .2], [1046, .34], [1318, .48]] : [[185, 0], [138, .14]];
        notes.forEach(([frequency, delay]) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          const start = context.currentTime + delay;
          oscillator.type = type === "wrong" ? "sawtooth" : "sine";
          oscillator.frequency.setValueAtTime(frequency, start);
          gain.gain.setValueAtTime(type === "wrong" ? .06 : .075, start);
          gain.gain.exponentialRampToValueAtTime(.001, start + .22);
          oscillator.connect(gain).connect(context.destination);
          oscillator.start(start); oscillator.stop(start + .24);
        });
        window.setTimeout(() => context.close(), type === "finale" ? 1050 : 700);
      } catch (_) { /* Audio feedback is optional and should never block the quiz. */ }
    }

    function showEffect(type) {
      effects.replaceChildren();
      const effect = document.createElement("div");
      effect.className = `feedback-effect feedback-effect--${type}`;
      effect.innerHTML = `<span class="feedback-effect__badge">${type === "correct" ? "✓" : "×"}</span>`;
      if (type === "correct") {
        ["#f8c84c", "#ff6b6b", "#5b52e8", "#16a66a", "#ff8a35", "#28a8e0", "#e547a0", "#fff"].forEach((color, index) => {
          const bit = document.createElement("span");
          bit.className = "confetti";
          bit.style.setProperty("--confetti", color);
          bit.style.setProperty("--rotate", `${index * 45}deg`);
          bit.style.setProperty("--x", `${Math.cos(index * Math.PI / 4) * 48}vw`);
          bit.style.setProperty("--y", `${Math.sin(index * Math.PI / 4) * 44}vh`);
          effect.append(bit);
        });
      }
      effects.append(effect);
      window.setTimeout(() => effect.remove(), type === "correct" ? 980 : 700);
    }

    function showLevelUp(level) {
      effects.replaceChildren();
      const levelUp = document.createElement("div");
      levelUp.className = "level-up";
      levelUp.innerHTML = `<div class="level-up__panel"><div class="level-up__stars" aria-hidden="true">★ ★ ★</div><p class="level-up__eyebrow">DESAFIO DESBLOQUEADO</p><strong>NÍVEL ${level}</strong><p>Você avançou para a próxima fase!</p></div>`;
      effects.append(levelUp);
      playTone("level");
      window.setTimeout(() => levelUp.remove(), 1280);
    }

    function showFinale() {
      effects.replaceChildren();
      const finale = document.createElement("div");
      finale.className = "finale";
      finale.innerHTML = `<div class="finale__content"><span class="finale__trophy" aria-hidden="true">🏆</span><strong>VOCÊ CONSEGUIU!</strong><p>Seis respostas certas!</p></div>`;
      ["#f8c84c", "#ff6b6b", "#5b52e8", "#32d583", "#ff8a35", "#28a8e0", "#e547a0", "#fff"].forEach((color, index) => {
        const bit = document.createElement("span");
        bit.className = "confetti";
        bit.style.setProperty("--confetti", color);
        bit.style.setProperty("--rotate", `${index * 45}deg`);
        bit.style.setProperty("--x", `${Math.cos(index * Math.PI / 4) * 55}vw`);
        bit.style.setProperty("--y", `${Math.sin(index * Math.PI / 4) * 50}vh`);
        finale.append(bit);
      });
      effects.append(finale);
      playTone("finale");
      window.setTimeout(() => { finale.remove(); showSummary(); }, 1360);
    }

    function mediaMarkup(question) {
      if (!question.media) return `<div class="media-placeholder"><strong>Imagem ou vídeo será adicionado aqui</strong><p>${question.mediaLabel}</p></div>`;
      const isVideo = /\.(mp4|mov|webm)$/i.test(question.media);
      return isVideo ? `<video controls playsinline preload="metadata" src="${question.media}" aria-label="${question.mediaLabel}"></video>` : `<img src="${question.media}" alt="${question.mediaLabel}">`;
    }

    function renderQuestion() {
      const question = questions[questionIndex];
      attempts = 0; isCorrect = false;
      progressLabel.textContent = `Pergunta ${questionIndex + 1} de ${questions.length}`;
      progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      attemptsLabel.textContent = "Tentativas nesta pergunta: 0";
      nextButton.hidden = true;
      content.innerHTML = `
        <p class="question-number">Ficha ${String(questionIndex + 1).padStart(2, "0")}</p>
        <h2 id="questionTitle">${question.title}</h2>
        <p class="prompt">${question.prompt}</p>
        <div class="media-frame">${mediaMarkup(question)}</div>
        <div class="answers" role="group" aria-label="Respostas possíveis">
          ${question.answers.map((answer, index) => `<button class="answer" type="button" data-index="${index}"><span class="answer-letter">${"ABCD"[index]}</span><span>${answer}</span></button>`).join("")}
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"><span class="feedback-icon" aria-hidden="true">💡</span><span>Escolha uma resposta.</span></div>`;
      content.querySelectorAll(".answer").forEach(button => button.addEventListener("click", () => selectAnswer(Number(button.dataset.index))));
    }

    function selectAnswer(choice) {
      if (isCorrect) return;
      const question = questions[questionIndex];
      const feedback = document.getElementById("feedback");
      const buttons = [...content.querySelectorAll(".answer")];
      attempts += 1; totalAttempts += 1;
      attemptsLabel.textContent = `Tentativas nesta pergunta: ${attempts}`;
      if (choice === question.correct) {
        isCorrect = true; playTone("correct"); showEffect("correct");
        buttons.forEach(button => button.disabled = true);
        buttons[choice].classList.add("correct");
        feedback.dataset.state = "correct";
        feedback.innerHTML = `<span class="feedback-icon" aria-hidden="true">✓</span><span><strong>Isso mesmo!</strong> ${question.answers[choice]} é a resposta certa.</span>`;
        nextButton.textContent = questionIndex === questions.length - 1 ? "Ver resultado" : "Próxima pergunta →";
        nextButton.hidden = false;
        nextButton.focus();
      } else {
        playTone("wrong"); showEffect("wrong");
        buttons[choice].disabled = true;
        buttons[choice].classList.add("wrong");
        feedback.dataset.state = "wrong";
        if (attempts >= 2) {
          feedback.innerHTML = `<span class="feedback-icon" aria-hidden="true">×</span><span><strong>Duas tentativas erradas.</strong> A rodada terminou.</span>`;
          window.setTimeout(showFailure, 480);
          return;
        }
        feedback.innerHTML = `<span class="feedback-icon" aria-hidden="true">↻</span><span><strong>Ainda não.</strong> Você tem mais uma tentativa.</span>`;
        quizCard.classList.remove("shake"); void quizCard.offsetWidth; quizCard.classList.add("shake");
      }
    }

    function showFailure() {
      progressLabel.textContent = "Rodada encerrada";
      progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      content.className = "summary";
      content.innerHTML = `<p class="question-number">Fim de jogo</p><h2>Você perdeu esta rodada.</h2><p>Foram duas tentativas incorretas nesta pergunta. Comece novamente para tentar chegar ao final.</p><div class="score failure-score"><strong>2 erros</strong><span>A rodada foi encerrada</span></div><button class="restart-button" id="restartButton" type="button">Tentar novamente</button>`;
      document.getElementById("actions").hidden = true;
      document.getElementById("restartButton").addEventListener("click", () => { questionIndex = 0; totalAttempts = 0; content.className = "quiz-content"; document.getElementById("actions").hidden = false; renderQuestion(); });
    }

    function showSummary() {
      progressLabel.textContent = "Rodada concluída";
      progressFill.style.width = "100%";
      content.className = "summary";
      content.innerHTML = `<div class="summary-celebration" aria-hidden="true">★ 🎉 ★</div><p class="question-number">Muito bem!</p><h2>Você completou o desafio.</h2><p>O grupo encontrou as seis respostas. Agora é um bom momento para comentar as imagens e os comerciais antes da próxima rodada.</p><div class="score"><strong>6 / 6</strong><span>${totalAttempts} tentativa${totalAttempts === 1 ? "" : "s"} no total</span></div><button class="restart-button" id="restartButton" type="button">Começar nova rodada</button>`;
      document.getElementById("actions").hidden = true;
      document.getElementById("restartButton").addEventListener("click", () => { questionIndex = 0; totalAttempts = 0; content.className = "quiz-content"; document.getElementById("actions").hidden = false; renderQuestion(); });
    }

    nextButton.addEventListener("click", () => {
      if (questionIndex === questions.length - 1) { showFinale(); return; }
      nextButton.disabled = true;
      showLevelUp(questionIndex + 2);
      window.setTimeout(() => { questionIndex += 1; nextButton.disabled = false; renderQuestion(); }, 1280);
    });
    renderQuestion();
  </script>
</body>
</html>
